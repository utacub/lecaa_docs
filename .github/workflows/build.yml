name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:single
      - run: npx vitest run
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          sleep 3
          export CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          node tests/e2e.mjs http://localhost:4173/
          # In-app Piper voices with the real (small) Ona and Pau models.
          mkdir -p piper && cd piper
          for v in ona pau; do mkdir -p $v && curl -sSL "https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-ca-upc_$v-x-low.tar.gz" | tar xz -C $v; done
          cd ..
          PIPER_DIR="$PWD/piper" node tests/neural.mjs http://localhost:4173/
          PIPER_DIR="$PWD/piper" node tests/neural.mjs "file://$PWD/dist-single/index.html"
      - uses: actions/upload-artifact@v4
        with: { name: LECAA-Docs-web, path: dist }
      - name: Single-file edition
        run: cp dist-single/index.html LECAA-Docs.html
      - uses: actions/upload-artifact@v4
        with: { name: LECAA-Docs-fitxer-unic, path: LECAA-Docs.html }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-64bit }
          - { os: windows-latest, target: i686-pc-windows-msvc, name: windows-32bit }
          - { os: macos-latest, target: universal-apple-darwin, name: macos }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libspeechd-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'LECAA Docs ${{ github.ref_name }}'
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: LECAA-Docs-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: ignore
