# Web: builds the online edition and the single file, runs the browser tests and, on main,
# publishes the online edition on GitHub Pages with the single file next to it (LECAA-Docs.html).
# Desktop installers: only for version tags (v*) or when started by hand from the Actions tab.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pictograms joined in large files, for "save them all" in the settings
        run: python3 -I scripts/pictos-paquets.py public/pictos
      - run: npm run build
      - run: npm run build:single
      - run: npx vitest run --passWithNoTests
      - name: Browser tests
        shell: bash
        run: |
          # Failed checks are also shown as annotations on the run, so they can be read without the log.
          check() { local s=0; "$@" 2>&1 | tee test-output.txt || s=$?; if [ "$s" -ne 0 ]; then grep -E "FAIL|Error" test-output.txt | head -20 | sed 's/^/::error::/'; tail -15 test-output.txt | sed 's/^/::error::/'; fi; return "$s"; }
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils   # pdftotext, pdffonts and pdfimages for the PDF checks
          npx vite preview --port 4173 --strictPort &
          python3 -m http.server 4174 --bind 127.0.0.1 -d dist &
          sleep 3
          export CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          check node tests/e2e.mjs http://localhost:4173/
          check node tests/pictos.mjs http://localhost:4173/
          check node tests/langs.mjs http://localhost:4173/
          check node tests/pwa.mjs http://lecaa.test:4174
          # The real Piper voices of Basque and Galician, downloaded from Hugging Face.
          check node tests/voices-langs.mjs http://localhost:4173/
          # In-app Piper voices with the real (small) Ona and Pau models.
          mkdir -p piper && cd piper
          for v in ona; do mkdir -p $v && curl -sSL "https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-ca-upc_$v-x-low.tar.gz" | tar xz -C $v; done
          mkdir -p es && curl -sSL "https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-es-carlfm-x-low.tar.gz" | tar xz -C es
          cd ..
          PIPER_DIR="$PWD/piper" check node tests/neural.mjs http://localhost:4173/
          PIPER_DIR="$PWD/piper" check node tests/neural.mjs "file://$PWD/dist-single/index.html"
      - uses: actions/upload-artifact@v4
        with: { name: LECAA-Docs-web, path: dist }
      - name: Single-file edition
        run: cp dist-single/index.html LECAA-Docs.html
      - uses: actions/upload-artifact@v4
        with: { name: LECAA-Docs-fitxer-unic, path: LECAA-Docs.html }
      - name: Portable edition (the single file and the pictograms folder next to it, for a USB stick)
        run: |
          mkdir -p portatil/LECAA-Docs
          cp dist-single/index.html portatil/LECAA-Docs/LECAA-Docs.html
          cp -r public/pictos portatil/LECAA-Docs/pictos && rm -rf portatil/LECAA-Docs/pictos/paquets
      - uses: actions/upload-artifact@v4
        with: { name: LECAA-Docs-portatil, path: portatil }
      - name: Site for GitHub Pages (online edition + single file)
        run: cp dist-single/index.html dist/LECAA-Docs.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  pages:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  desktop:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-64bit }
          - { os: windows-latest, target: i686-pc-windows-msvc, name: windows-32bit }
          - { os: macos-latest, target: universal-apple-darwin, name: macos }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libspeechd-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'LECAA Docs ${{ github.ref_name }}'
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: LECAA-Docs-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: ignore
