[package]
name = "lecaa-docs"
version = "0.3.0"
description = "LECAA Docs: processador de textos amb text a veu"
edition = "2021"
publish = false

[lib]
name = "lecaa_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Speech",
  "Win32_System_Com",
] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tts = "0.26"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
